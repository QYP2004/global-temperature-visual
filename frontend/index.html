<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 圆桌演播厅</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="home-wrap">
    <div class="brand"><span class="dot"></span><h1>AI 圆桌演播厅</h1></div>
    <p class="subtitle">输入话题，AI 自动生成主持人与专家阵容，实时开一场有共识、有分歧的讨论。</p>

    <div class="card">
      <h2>发起新讨论</h2>
      <div class="form-row">
        <input type="text" id="topic" placeholder="输入话题，例如：AI 会取代初级程序员吗？" />
        <select id="count">
          <option value="2">2 位专家</option>
          <option value="3" selected>3 位专家</option>
          <option value="4">4 位专家</option>
          <option value="5">5 位专家</option>
          <option value="6">6 位专家</option>
        </select>
        <button class="btn-primary" id="createBtn">生成阵容</button>
      </div>
      <p id="createHint" style="color:var(--muted);font-size:12px;margin:10px 0 0;"></p>
    </div>

    <div class="card">
      <h2>正在进行与历史讨论</h2>
      <div id="list"><div class="empty">加载中…</div></div>
    </div>
  </div>
  <script src="/js/home.js"></script>
</body>
</html>
